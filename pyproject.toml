[project]
name = "flight-booking-lab"
version = "0.1.0"
description = "Deterministic flight-booking environment for agent experiments"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5", "langchain-core==1.6.6", "langgraph==1.2.12",
    "langchain-google-genai==4.4.0", "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
